<footer class="footer bg-secondary border-t text-base-content p-10">
  <aside>
    <div class="flex items-center gap-3">
      <fa-icon class="text-primary" [icon]="['fas', 'sun']" size="2x"></fa-icon>
      <span class="font-bold text-xl">{{ brand.name }}</span>
    </div>
    <p class="text-sm">{{ brand.tagline }}</p>
  </aside>
  <nav>
    <h6 class="footer-title">Shop</h6>
    <a routerLink="/products" class="link link-hover">All products</a>
    <a routerLink="/cart" class="link link-hover">Cart</a>
    <a routerLink="/users/orders" class="link link-hover">My orders</a>
  </nav>
  <nav>
    <h6 class="footer-title">Pay with</h6>
    <span>M-Pesa</span>
    <span>Card (Stripe)</span>
  </nav>
</footer>
<footer class="footer bg-secondary text-base-content px-10 py-4 border-t">
  <aside class="text-sm">
    A portfolio project by Brian Ndegwa. Products, prices and orders are for demonstration.
  </aside>
  <nav class="md:place-self-center md:justify-self-end">
    <a [href]="brand.repositoryUrl" aria-label="Source code on GitHub" target="_blank" rel="noopener">
      <fa-icon [icon]="['fab', 'github']" size="2x"></fa-icon>
    </a>
  </nav>
</footer>
