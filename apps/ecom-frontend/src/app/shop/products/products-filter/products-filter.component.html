<form [formGroup]="formFilterProducts">
  <div class="font-bold text-lg mb-2">Power rating</div>
  <label class="cursor-pointer label justify-start items-center">
    <input type="radio" value="" class="radio radio-primary" formControlName="power"/>
    <span class="label-text ms-3">Any</span>
  </label>
  @for (band of powerBands; track band.key) {
    <label class="cursor-pointer label justify-start items-center">
      <input type="radio" [value]="band.key" class="radio radio-primary" formControlName="power"/>
      <span class="label-text ms-3">{{ band.label }}</span>
    </label>
  }
  <div class="font-bold text-lg mt-5 mb-2">Sorted By</div>
  <label class="cursor-pointer label justify-start items-center">
    <input type="radio" value="asc" class="radio radio-primary" formControlName="sort"/>
    <span class="label-text ms-3">Oldest</span>
  </label>
  <label class="cursor-pointer label justify-start items-center">
    <input type="radio" value="desc" class="radio radio-primary" formControlName="sort"/>
    <span class="label-text ms-3">Newest</span>
  </label>
</form>
